name: Reusable mobile analysis

on:
  workflow_call:
    inputs:
      target_url:
        description: Deployed web URL to analyze.
        required: true
        type: string
      config_path:
        description: Path to mobile-analysis config in the calling repository.
        required: false
        default: mobile-analysis.config.json
        type: string
      run_unlighthouse:
        description: Run the site-wide Unlighthouse layer.
        required: false
        default: true
        type: boolean
      revision:
        description: Exact consumer Git revision represented by this deployed app.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Checkout exact mobile-analysis workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/mobile-analysis
          ref: ${{ job.workflow_sha }}
          path: .mobile-analysis-tool

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: Analyze deployed app
        uses: ./.mobile-analysis-tool
        with:
          target_url: ${{ inputs.target_url }}
          config_path: ${{ inputs.config_path }}
          output_dir: mobile-analysis-output
          run_unlighthouse: ${{ inputs.run_unlighthouse }}
          revision: ${{ inputs.revision || github.sha }}

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-analysis
          path: mobile-analysis-output
          if-no-files-found: warn
          retention-days: 14
