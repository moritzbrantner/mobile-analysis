<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mobile-analysis</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">mobile-analysis</p>
      <h1>Mobile evidence explorer</h1>
      <p>Inspect a portable <code>analysis.json</code> bundle produced by CI or a local run.</p>
      <label class="file-picker">Open analysis.json <input id="file" type="file" accept="application/json,.json"></label>
    </header>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>
      <p id="summary">Loading sample report…</p>
      <dl id="environment"></dl>
    </section>

    <section aria-labelledby="scenarios-heading">
      <h2 id="scenarios-heading">Scenarios</h2>
      <div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Device</th><th>Status</th><th>Duration</th><th>URL</th></tr></thead><tbody id="scenarios"></tbody></table></div>
    </section>

    <section aria-labelledby="findings-heading">
      <h2 id="findings-heading">Findings</h2>
      <div class="table-wrap"><table><thead><tr><th>Severity</th><th>Source</th><th>Finding</th><th>Context</th></tr></thead><tbody id="findings"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
